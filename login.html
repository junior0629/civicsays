<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#111111" />
  <title>Sign in — CivicSays</title>
  <meta name="description" content="Sign in to the CivicSays staff dashboard." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

  <link rel="stylesheet" href="style/tokens.css" />
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/components.css" />
  <link rel="stylesheet" href="style/layout.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self';" />

  <script src="js/config.js"></script>
  <script src="env-loader.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>

  <nav class="navbar" aria-label="Primary">
    <div class="container">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html" aria-label="CivicSays home">
          <img src="Logo.png" alt="" />
          <span>CivicSays</span>
        </a>
        <div class="navbar-links">
          <a class="navbar-link" href="index.html">Home</a>
        </div>
        <div class="navbar-actions">
          <a class="btn btn-ghost btn-sm" href="index.html">Back to home</a>
        </div>
      </div>
    </div>
  </nav>

  <main id="main" class="page">
    <div class="page-main">
      <div class="container narrow">
        <div class="stack gap-2" style="margin-bottom: var(--space-8); text-align: center;">
          <span class="section-eyebrow">Staff</span>
          <h1 style="font-size: clamp(1.75rem, 3vw, 2.25rem); font-weight: var(--fw-semibold); letter-spacing: -0.02em; line-height: 1.15;">
            Sign in to the dashboard
          </h1>
          <p style="color: var(--text-secondary); max-width: 520px; margin: 0 auto; line-height: var(--lh-relaxed);">
            Government staff only. Residents don't need an account — use
            <a href="submit.html" style="color: var(--accent); text-decoration: underline; text-underline-offset: 2px;">Submit</a>
            or
            <a href="track.html" style="color: var(--accent); text-decoration: underline; text-underline-offset: 2px;">Track</a>
            on the home page.
          </p>
        </div>

        <form id="login-form" class="glass-card" novalidate aria-labelledby="login-heading">
          <div class="field">
            <label class="field-label" for="f-email">
              Email <span class="required">*</span>
            </label>
            <input class="input" type="email" id="f-email" name="email"
                   required maxlength="200" autocomplete="username"
                   placeholder="you@city.gov"
                   aria-describedby="hint-email err-email" />
            <span class="field-hint" id="hint-email">Use the email you were registered with.</span>
            <span class="field-error" id="err-email" role="alert"></span>
          </div>

          <div class="field" style="margin-top: var(--space-4);">
            <label class="field-label" for="f-password">
              Password <span class="required">*</span>
            </label>
            <input class="input" type="password" id="f-password" name="password"
                   required minlength="8" maxlength="200" autocomplete="current-password"
                   placeholder="••••••••"
                   aria-describedby="err-password" />
            <span class="field-error" id="err-password" role="alert"></span>
          </div>

          <div id="form-error" class="form-error" role="alert" hidden
               style="margin-top: var(--space-4); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--status-error-soft, rgba(220, 80, 80, 0.12)); color: var(--status-error); font-size: var(--fs-sm); line-height: var(--lh-relaxed); border: 1px solid var(--status-error);"></div>

          <div class="form-actions" style="margin-top: var(--space-6);">
            <button type="submit" class="btn btn-primary" id="login-submit"
                    data-busy-text="Signing in…">
              Sign in
            </button>
            <a class="btn btn-ghost" href="index.html">Cancel</a>
          </div>
        </form>

        <p style="margin-top: var(--space-6); text-align: center; color: var(--text-muted); font-size: var(--fs-sm);">
          Trouble signing in? Contact your administrator.
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
