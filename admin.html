<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#111111" />
  <title>Dashboard — CivicSays</title>
  <meta name="description" content="CivicSays staff dashboard." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="style/tokens.css" />
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/components.css" />
  <link rel="stylesheet" href="style/layout.css" />
  <link rel="icon" type="image/png" href="Logo.png" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self';" />

  <script src="js/config.js"></script>
  <script src="env-loader.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>

  <nav class="navbar" aria-label="Primary">
    <div class="container">
      <div class="navbar-inner">
        <a class="navbar-brand" href="admin.html" aria-label="CivicSays dashboard">
          <img src="Logo.png" alt="" />
          <span>CivicSays</span>
        </a>
        <div class="navbar-links">
          <a class="navbar-link is-active" href="admin.html">Dashboard</a>
        </div>
        <div class="navbar-actions" id="nav-action" data-testid="nav-action">
          <span class="text-muted" style="font-size: var(--fs-sm);">Loading…</span>
        </div>
      </div>
    </div>
  </nav>

  <main id="main" class="page">
    <div class="page-main">
      <div class="container">
        <div class="stack gap-2" style="margin-bottom: var(--space-6);">
          <span class="section-eyebrow">Staff</span>
          <h1 id="dash-title" style="font-size: clamp(1.75rem, 3vw, 2.25rem); font-weight: var(--fw-semibold); letter-spacing: -0.02em; line-height: 1.15;">
            Dashboard
          </h1>
        </div>

        <div id="admin-region" data-testid="admin-region" class="stack gap-6">
          <!-- Tabs -->
          <div class="tabs" role="tablist" aria-label="Sections">
            <button type="button" class="tab is-active" role="tab" id="tab-tickets"
                    aria-selected="true" aria-controls="panel-tickets" data-tab="tickets">
              <span>Tickets</span>
              <span class="count" id="tickets-count" data-testid="tickets-count">…</span>
            </button>
            <button type="button" class="tab" role="tab" id="tab-inquiries"
                    aria-selected="false" aria-controls="panel-inquiries" data-tab="inquiries" tabindex="-1">
              <span>Inquiries</span>
              <span class="count" id="inquiries-count" data-testid="inquiries-count">…</span>
            </button>
          </div>

          <!-- Tickets panel -->
          <section id="panel-tickets" role="tabpanel" aria-labelledby="tab-tickets"
                   data-testid="panel-tickets" class="stack gap-4">
            <div class="filter-row" data-testid="status-filter" role="group" aria-label="Filter by status">
              <span class="filter-label">Status</span>
              <button type="button" class="filter-pill is-active" data-status="" data-testid="filter-status-all">All</button>
              <button type="button" class="filter-pill" data-status="pending" data-testid="filter-status-pending">Pending</button>
              <button type="button" class="filter-pill" data-status="in_process" data-testid="filter-status-in_process">In Process</button>
              <button type="button" class="filter-pill" data-status="hold" data-testid="filter-status-hold">On Hold</button>
              <button type="button" class="filter-pill" data-status="solved" data-testid="filter-status-solved">Solved</button>
            </div>
            <div class="filter-row" data-testid="kind-filter" role="group" aria-label="Filter by kind">
              <span class="filter-label">Type</span>
              <button type="button" class="filter-pill is-active" data-kind="" data-testid="filter-kind-all">All</button>
              <button type="button" class="filter-pill" data-kind="request" data-testid="filter-kind-request">Request</button>
              <button type="button" class="filter-pill" data-kind="complaint" data-testid="filter-kind-complaint">Complaint</button>
            </div>
            <div id="ticket-list" class="stack gap-3" data-testid="ticket-list" aria-live="polite">
              <div class="text-muted" style="padding: var(--space-6); text-align: center;">Loading…</div>
            </div>
          </section>

          <!-- Inquiries panel -->
          <section id="panel-inquiries" role="tabpanel" aria-labelledby="tab-inquiries"
                   data-testid="panel-inquiries" class="stack gap-4" hidden>
            <div class="filter-row" data-testid="inquiry-status-filter" role="group" aria-label="Filter by status">
              <span class="filter-label">Status</span>
              <button type="button" class="filter-pill is-active" data-inq-status="" data-testid="filter-inq-all">All</button>
              <button type="button" class="filter-pill" data-inq-status="waiting" data-testid="filter-inq-waiting">Waiting</button>
              <button type="button" class="filter-pill" data-inq-status="active" data-testid="filter-inq-active">Active</button>
              <button type="button" class="filter-pill" data-inq-status="resolved" data-testid="filter-inq-resolved">Resolved</button>
            </div>
            <div id="inquiry-list" class="stack gap-3" data-testid="inquiry-list" aria-live="polite">
              <div class="text-muted" style="padding: var(--space-6); text-align: center;">Loading…</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
