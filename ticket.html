<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#111111" />
  <title>Ticket — CivicSays</title>
  <meta name="description" content="View ticket status, comments, and history." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="style/tokens.css" />
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/components.css" />
  <link rel="stylesheet" href="style/layout.css" />

  <link rel="icon" type="image/png" href="Logo.png" />

  <!--
    Content Security Policy — extended for video embeds:
      - frame-src: allow YouTube, Vimeo, TikTok, and Google Drive (the four
        platforms we embed directly). Facebook/X are rendered as clickable
        <a> links and don't need frame-src.
      - img-src:   allow YouTube thumbnail host (i.ytimg.com) and Google
        user content (lh3.googleusercontent.com) for Drive preview thumbnails.
    The rest of the policy mirrors submit.html.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co https://i.ytimg.com https://*.googleusercontent.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.tiktok.com https://drive.google.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self';" />

  <script src="js/config.js"></script>
  <script src="env-loader.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>

  <nav class="navbar" aria-label="Primary">
    <div class="container">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html" aria-label="CivicSays home">
          <img src="Logo.png" alt="" />
          <span>CivicSays</span>
        </a>
        <div class="navbar-links">
          <a class="navbar-link" href="index.html">Home</a>
          <a class="navbar-link" href="index.html#features">Features</a>
          <a class="navbar-link" href="index.html#how">How it works</a>
          <a class="navbar-link" href="index.html#faq">FAQ</a>
        </div>
        <div class="navbar-actions">
          <a class="btn btn-ghost btn-sm" href="track.html">Track another</a>
          <a class="btn btn-primary btn-sm" href="login.html">Log in</a>
        </div>
      </div>
    </div>
  </nav>

  <main id="main" class="page">
    <div class="page-main">
      <div class="container narrow" style="max-width: 920px;">

        <!--
          Top breadcrumb / back link. Always present so users have an
          exit even if the ticket fails to load.
        -->
        <div style="margin-bottom: var(--space-4);">
          <a href="track.html" style="font-size: var(--fs-sm); color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-2);">
            <svg class="icon" aria-hidden="true" style="width: 14px; height: 14px;"><use href="assets/icons.svg#i-arrow-left"></use></svg>
            Back to tracking
          </a>
        </div>

        <!--
          Status region. The JS will replace the contents of #ticket-region
          with either:
            1) a skeleton while loading (rendered in HTML for SSR fallback)
            2) the populated ticket detail
            3) a 404 state
            4) a network error state
          Keeping this as a single region (rather than scattered slots)
          means the JS only has one mount point to find.
        -->
        <div id="ticket-region" aria-live="polite" aria-busy="true">

          <!-- Skeleton (visible until JS replaces it) -->
          <div class="ticket-top" aria-hidden="true">
            <!-- Resident panel placeholder (left) -->
            <div class="resident-panel ticket-section">
              <span class="skeleton" style="width: 140px; height: 12px; display: block;"></span>
              <span class="skeleton" style="display: block; width: 100%; height: 12px; margin-top: var(--space-4);"></span>
              <span class="skeleton" style="display: block; width: 80%; height: 12px; margin-top: var(--space-3);"></span>
              <span class="skeleton" style="display: block; width: 90%; height: 12px; margin-top: var(--space-3);"></span>
              <span class="skeleton" style="display: block; width: 100%; height: 12px; margin-top: var(--space-3);"></span>
            </div>

            <!-- Main content placeholder (right) -->
            <div class="ticket-main">
              <div class="ticket-header">
                <span class="skeleton" style="width: 140px; height: 20px;"></span>
                <span class="skeleton" style="width: 80px; height: 24px; border-radius: 999px;"></span>
                <span class="skeleton" style="width: 60px; height: 24px; border-radius: 999px;"></span>
                <span class="skeleton" style="width: 100px; height: 12px; margin-left: auto;"></span>
              </div>
              <div class="status-pipeline">
                <span class="skeleton" style="display: block; width: 100%; height: 60px; border-radius: var(--radius-card-lg);"></span>
              </div>
              <div class="ticket-body-grid">
                <div class="ticket-section">
                  <span class="skeleton" style="width: 100px; height: 10px; margin-bottom: var(--space-3); display: block;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 100%;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 100%;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 80%;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 90%;"></span>
                </div>
                <div class="ticket-section">
                  <span class="skeleton" style="width: 80px; height: 10px; margin-bottom: var(--space-3); display: block;"></span>
                  <span class="skeleton" style="width: 200px; height: 18px; margin-bottom: var(--space-3); display: block;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 100%;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 100%;"></span>
                  <span class="skeleton skeleton-line" style="display: block; width: 70%;"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="ticket-section" style="margin-top: var(--space-6);" aria-hidden="true">
            <span class="skeleton" style="width: 120px; height: 10px; margin-bottom: var(--space-3); display: block;"></span>
            <span class="skeleton" style="width: 100%; height: 200px; border-radius: var(--radius-card); display: block;"></span>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/ticket.js"></script>
</body>
</html>
