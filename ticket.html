<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#111111" />
  <title>Setup in progress — CivicSays</title>
  <meta name="description" content="This page is part of the next build phase." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

  <link rel="stylesheet" href="style/tokens.css" />
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/components.css" />
  <link rel="stylesheet" href="style/layout.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />

  <script src="js/config.js"></script>
  <script src="env-loader.js"></script>
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>

  <nav class="navbar" aria-label="Primary">
    <div class="container">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html" aria-label="CivicSays home">
          <img src="Logo.png" alt="" />
          <span>CivicSays</span>
        </a>
        <div class="navbar-actions">
          <a class="btn btn-ghost btn-sm" href="index.html">Back to home</a>
        </div>
      </div>
    </div>
  </nav>

  <main id="main" class="page">
    <div class="page-main" style="display:flex; align-items:center; justify-content:center;">
      <div class="container narrow">
        <div class="glass-card fade-in" style="padding:var(--space-12) var(--space-8); text-align:center;">
          <div style="display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; background:var(--accent-soft); color:var(--accent); border-radius:var(--radius-full); margin-bottom:var(--space-6);">
            <svg class="icon" aria-hidden="true" style="width:28px; height:28px;"><use href="assets/icons.svg#i-sparkles"></use></svg>
          </div>

          <h1 id="page-title" style="font-size:var(--fs-2xl); font-weight:var(--fw-semibold); margin-bottom:var(--space-3); letter-spacing:var(--letter-tight);">
            Welcome
          </h1>
          <p id="page-message" style="font-size:var(--fs-md); color:var(--text-secondary); line-height:var(--lh-relaxed); max-width:480px; margin:0 auto var(--space-8);">
            This page is part of the next build phase.
          </p>

          <div class="row gap-3" style="justify-content:center; flex-wrap:wrap;">
            <a class="btn btn-secondary" href="index.html">Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { injectSprite } from './js/icons.js';

    injectSprite();

    var path = window.location.pathname;
    var filename = path.substring(path.lastIndexOf('/') + 1);

    var titles = {
      'submit.html': { title: 'Submit a ticket', message: 'This is the page where residents file a new request or complaint. The form, photo upload, and tracking ID generation are part of the next build phase.' },
      'track.html':  { title: 'Track a ticket',  message: 'Look up any ticket by its tracking ID — see status, comments, and full history. Coming up after the resident submission flow ships.' },
      'ticket.html': { title: 'Ticket detail',   message: 'Three-column view: ticket info, issue details, and the full comments + history thread. Built after submission and lookup are working.' },
      'login.html':  { title: 'Official login',  message: 'Government officials sign in here. The admin side of CivicSays is built after the resident flows are done.' },
      'admin.html':  { title: 'Admin dashboard', message: 'The management view: stats, ticket queue, inquiry panel, and live chat. This is the official side of CivicSays — built after resident flows are working.' },
    };

    var info = titles[filename] || { title: 'Coming up', message: 'This page is part of the next build phase.' };
    document.getElementById('page-title').textContent = info.title;
    document.getElementById('page-message').textContent = info.message;
  </script>
</body>
</html>
